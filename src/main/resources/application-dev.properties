# Lee secretos locales opcionales sin versionarlos. El envFile de VS Code los
# pasa al proceso Java; esta importación también permite el arranque por Maven.
spring.config.import=optional:classpath:application-local.properties,optional:file:.env[.properties]

# Flyway crea y versiona el esquema; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Activar SOLO cuando exista data.sql 
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true