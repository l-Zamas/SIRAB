spring.application.name=sirab
spring.profiles.default=dev

# Conexión a MySQL. Si la base de datos "sirab" no existe, se crea sola.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sirab?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false

# Subida del documento de identidad
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Sesión (el registro por pasos se guarda aquí)
server.servlet.session.timeout=30m

# Cálculo de urgencia (valores de ejemplo, por validar)
sirab.urgencia.peso-vulnerabilidad=3
sirab.urgencia.peso-necesidad=2
sirab.urgencia.peso-tiempo=1
sirab.urgencia.umbral-critica=8
sirab.urgencia.umbral-alta=5
sirab.urgencia.umbral-media=3