spring.application.name=sirab
spring.profiles.default=dev

# Conexión a MySQL. Si la base de datos "sirab" no existe, se crea sola.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sirab}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never

# Subida del documento de identidad
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Sesión (el registro por pasos se guarda aquí)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax