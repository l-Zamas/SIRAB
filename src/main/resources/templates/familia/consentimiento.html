<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consentimiento - SIRAB</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>
<main>
    <a th:href="@{/familia/registro}">‹ Atrás</a>
    <h1>SIRAB</h1>
    <h2>Antes de empezar</h2>
    <p>Necesitamos tu permiso para usar los datos de tu familia.</p>
    <section class="tarjeta">
        <h3>Cómo usamos tus datos</h3>
        <ul>
            <li>Solo para coordinar la ayuda humanitaria.</li>
            <li>Los ve únicamente el personal autorizado.</li>
            <li>Puedes pedir que se corrijan o se eliminen.</li>
        </ul>
    </section>
    <form th:action="@{/familia/registro/consentimiento}" th:object="${consentimientoForm}" method="post">
        <div class="consentimiento">
            <input id="aceptado" type="checkbox" th:field="*{aceptado}">
            <label for="aceptado">Acepto el uso de mis datos</label>
        </div>
        <p class="error" role="alert" th:if="${#fields.hasErrors('aceptado')}"
           th:errors="*{aceptado}"></p>
        <button type="submit">Aceptar y continuar</button>
    </form>
</main>
</body>
</html>
