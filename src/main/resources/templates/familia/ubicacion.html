<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ubicación - SIRAB</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
    <link rel="stylesheet" th:href="@{/css/registro-ciudadano.css}">
</head>
<body class="registro-ciudadano">
<th:block th:replace="~{familia/fragmentos-registro :: encabezado}"></th:block>
<main id="contenido" class="registro-main">
    <a class="registro-atras" th:href="@{/familia/registro/datos}">‹ Atrás</a>
    <div th:replace="~{familia/fragmentos-registro :: progreso(2)}"></div>
    <p class="registro-etiqueta">Ubicación</p>
    <h1>¿Dónde están?</h1>
    <p class="registro-introduccion">Así sabremos a dónde llegar con la ayuda.</p>
    <form class="registro-formulario registro-ubicacion" th:action="@{/familia/registro/ubicacion}" th:object="${ubicacionForm}" method="post">
        <div class="campo">
            <label for="barrio">Barrio (obligatorio)</label>
            <input id="barrio" type="text" th:field="*{barrio}" maxlength="120" autocomplete="address-level3"
                   placeholder="Ej. Bellavista" required
                   th:attr="aria-invalid=${#fields.hasErrors('barrio')},
                            aria-describedby=${#fields.hasErrors('barrio')} ? 'barrio-error' : null">
            <p class="error" id="barrio-error" role="alert"
               th:if="${#fields.hasErrors('barrio')}" th:errors="*{barrio}"></p>
        </div>
        <div class="campo">
            <label for="direccion">Dirección (obligatoria)</label>
            <input id="direccion" type="text" th:field="*{direccion}" maxlength="255"
                   autocomplete="street-address" placeholder="Ej. Calle 10 # 5-20" required
                   th:attr="aria-invalid=${#fields.hasErrors('direccion')},
                            aria-describedby=${#fields.hasErrors('direccion')} ? 'direccion-error' : null">
            <p class="error" id="direccion-error" role="alert"
               th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
        </div>
        <div class="campo">
            <label for="direccionReferencia">Punto de referencia (opcional)</label>
            <input id="direccionReferencia" type="text" th:field="*{direccionReferencia}" maxlength="255"
                   placeholder="Ej. Frente a la escuela"
                   th:attr="aria-invalid=${#fields.hasErrors('direccionReferencia')},
                            aria-describedby=${#fields.hasErrors('direccionReferencia')} ? 'referencia-error' : null">
            <p class="error" id="referencia-error" role="alert"
               th:if="${#fields.hasErrors('direccionReferencia')}" th:errors="*{direccionReferencia}"></p>
        </div>
        <button class="registro-primario" type="submit">Continuar</button>
    </form>
</main>
</body>
</html>
