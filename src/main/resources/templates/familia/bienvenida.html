<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIRAB - Registro familiar</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>
    <main>
        <h1 th:text="${nombre}">SIRAB</h1>
        <p>Sistema Integral de Respuesta y Ayuda para Buenaventura</p>
        <h2>Registra a tu familia para recibir ayuda</h2>
        <p>Cuéntanos qué necesitan. Nos toma unos minutos y puedes hacerlo desde tu celular.</p>
        <a class="boton" th:href="@{/familia/registro/consentimiento}">Registrar mi familia</a>
        <button type="button" disabled aria-disabled="true">Consultar mi estado (próximamente)</button>
        <p>Tus datos se usan solo para coordinar la ayuda.</p>
    </main>
</body>
</html>
